name: test

on:
  workflow_call: {}

permissions:
  contents: read

jobs:

  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      with:
        persist-credentials: false

    - name: Load versions
      id: versions
      uses: ./.github/actions/load-versions

    - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
      with:
        go-version: ${{ steps.versions.outputs.go }}
        cache: true
        cache-dependency-path: go.sum

    - name: Format check
      run: make fmt-check

    - name: Tidy
      run: go mod tidy

    - name: Test
      run: make test-coverage

    - name: Coverage
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
      with:
        # Codecov is an observability nice-to-have; don't fail CI on
        # transient upload or GPG-validation errors.
        fail_ci_if_error: false
        use_oidc: true
        skip_validation: true

    - name: Lint Go
      uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee  # v9.2.1
      with:
        version: ${{ steps.versions.outputs.golangci_lint }}

    - name: Lint YAML
      uses: karancode/yamllint-github-action@4052d365f09b8d34eb552c363d1141fd60e2aeb2  # v3.0.0
      with:
        yamllint_config_filepath: .yamllint

    - name: Lint GitHub Actions workflows
      uses: docker://rhysd/actionlint:1.7.7
      with:
        args: -color

    - name: Verify deployment manifest matches kustomize base
      run: |
        set -euo pipefail
        kubectl kustomize deployment/base > /tmp/rendered-manifest.yaml
        if ! diff -u deployment/manifest.yaml /tmp/rendered-manifest.yaml; then
          echo "::error::deployment/manifest.yaml is out of sync with deployment/base."
          echo "Regenerate with: kubectl kustomize deployment/base > deployment/manifest.yaml"
          exit 1
        fi

    - name: Install Trivy
      run: |
        sudo apt-get install -y wget apt-transport-https gnupg
        wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
        echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
        sudo apt-get update
        sudo apt-get install -y trivy
        trivy --version

    - name: Scan
      run: |
        trivy fs . \
          --ignore-unfixed \
          --format sarif \
          --output trivy-results.sarif \
          --severity ${{ steps.versions.outputs.scan_severity }} \
          --exit-code 1

    - name: Upload Scan Results
      if: always()
      uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e  # v4.36.2
      with:
        sarif_file: trivy-results.sarif

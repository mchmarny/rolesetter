name: on_tag
on:
  push:
    tags:
    # Semantic versioning with optional pre-release suffix (e.g., v1.2.3, v1.2.3-rc1).
    - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:

  detect:
    name: Detect Release Type
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions:
      contents: read
    outputs:
      is_prerelease: ${{ steps.check.outputs.is_prerelease }}
    steps:
      - name: Check tag for pre-release suffix
        id: check
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "${TAG}" == *-* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "Pre-release detected: ${TAG}"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            echo "Stable release: ${TAG}"
          fi

  test:
    uses: ./.github/workflows/test.yaml
    permissions:
      contents: read
      security-events: write
      id-token: write

  release:
    needs: [test, detect]
    timeout-minutes: 30
    env:
      DEPLOYMENT_PATCH_FILE: deployment/overlays/dev/patch-deployment.yaml
    outputs:
      image-uri: ${{ steps.image.outputs.uri }}
      image-name: ${{ steps.image.outputs.name }}
      image-digest: ${{ steps.image.outputs.digest }}
      source-uri: "github.com/${{ github.repository }}"
      source-tag: ${{ github.ref_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      security-events: write
      id-token: write
      packages: write
      attestations: write
    steps:

    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Load versions
      id: versions
      uses: ./.github/actions/load-versions

    - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
      with:
        go-version: ${{ steps.versions.outputs.go }}
        cache: true
        cache-dependency-path: go.sum

    - name: Install GoReleaser
      uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89  # v7.2.2
      with:
        install-only: true
        version: ${{ steps.versions.outputs.goreleaser }}

    - name: Login to GHCR
      uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4.2.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: make release

    - name: Extract Image Metadata
      id: image
      run: |
        set -euo pipefail
        jq -r '.[] | select(.type == "Docker Manifest")' dist/artifacts.json
        DIGEST=$(jq -r '[.[] | select(.type == "Docker Manifest")] | first | .extra.Digest' dist/artifacts.json)
        REPO=$(jq -r '[.[] | select(.type == "Docker Manifest")] | first | .path' dist/artifacts.json)
        if [ -z "$REPO" ] || [ "$REPO" = "null" ]; then
          REPO=$(jq -r '[.[] | select(.type == "Docker Manifest")] | first | .name' dist/artifacts.json)
        fi
        # Strip any tag or digest suffix to get bare repository name
        REPO="${REPO%%@*}"
        REPO="${REPO%%:*}"
        {
          echo "uri=${REPO}@${DIGEST}"
          echo "digest=${DIGEST}"
          echo "name=${REPO}"
        } >> "$GITHUB_OUTPUT"

    - name: Setup KinD Cluster
      uses: chainguard-dev/actions/setup-kind@e1c4977ad9cb32b12c5b222ec0134a22bec60bd5  # v1.6.25
      with:
        kind-version: ${{ steps.versions.outputs.kind_version }}
        k8s-version: ${{ steps.versions.outputs.k8s_version }}
        kind-worker-count: ${{ steps.versions.outputs.worker_node_count }}

    - name: Set Dev Image
      env:
        IMAGE_URI: ${{ steps.image.outputs.uri }}
      run: tests/set-dev-image "$IMAGE_URI" "$DEPLOYMENT_PATCH_FILE"

    - name: Run Integration Tests
      env:
        WORKER_COUNT: ${{ steps.versions.outputs.worker_node_count }}
      run: tests/integration "$WORKER_COUNT"

    - name: Install Trivy
      run: |
        set -euo pipefail
        sudo apt-get install -y wget apt-transport-https gnupg
        wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
        echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
        sudo apt-get update
        sudo apt-get install -y trivy

    - name: Scan Image
      env:
        IMAGE_URI: ${{ steps.image.outputs.uri }}
        SEVERITY: ${{ steps.versions.outputs.scan_severity }}
      run: |
        set -euo pipefail
        trivy image "$IMAGE_URI" \
          --format sarif \
          --output trivy-results.sarif \
          --severity "$SEVERITY" \
          --timeout 10m \
          --exit-code 1

    - name: Upload Scan Results
      if: always()
      uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e  # v4.36.2
      with:
        sarif_file: trivy-results.sarif

  helm-publish:
    needs: [release, detect]
    # Skip helm chart publish for pre-release tags.
    if: needs.detect.outputs.is_prerelease == 'false'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    concurrency:
      group: helm-publish-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      with:
        persist-credentials: false
    - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1
    - name: Login to GHCR
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        ACTOR: ${{ github.actor }}
      run: echo "$GITHUB_TOKEN" | helm registry login ghcr.io -u "$ACTOR" --password-stdin
    - name: Package and Push Chart
      env:
        TAG: ${{ github.ref_name }}
      run: |
        set -euo pipefail
        VERSION="${TAG#v}"
        sed -i "s/^version:.*/version: ${VERSION}/" chart/Chart.yaml
        sed -i "s/^appVersion:.*/appVersion: \"${VERSION}\"/" chart/Chart.yaml
        helm package chart/
        helm push "node-role-controller-${VERSION}.tgz" oci://ghcr.io/mchmarny

  provenance:
    needs: [release]
    permissions:
      actions: read
      id-token: write
      packages: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0  # Must use tagged version
    with:
      image: ${{ needs.release.outputs.image-name }}
      digest: ${{ needs.release.outputs.image-digest }}
      registry-username: ${{ github.actor }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  verification:
    needs: [release, provenance]
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: slsa-framework/slsa-verifier/actions/installer@ea584f4502babc6f60d9bc799dbbb13c1caa9ee6  # v2.7.1
    - name: Verify SLSA Provenance (slsa-verifier)
      env:
        IMAGE_URI: ${{ needs.release.outputs.image-uri }}
        SOURCE_URI: ${{ needs.release.outputs.source-uri }}
        SOURCE_TAG: ${{ needs.release.outputs.source-tag }}
      run: |
        set -euo pipefail
        slsa-verifier verify-image "$IMAGE_URI" \
          --source-uri "$SOURCE_URI" \
          --source-tag "$SOURCE_TAG"

  summary:
    name: Release Summary
    runs-on: ubuntu-latest
    needs: [detect, test, release, helm-publish, provenance, verification]
    if: always()
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Release Summary
        env:
          DETECT: ${{ needs.detect.result }}
          TESTS: ${{ needs.test.result }}
          RELEASE: ${{ needs.release.result }}
          HELM_PUBLISH: ${{ needs.helm-publish.result }}
          PROVENANCE: ${{ needs.provenance.result }}
          VERIFICATION: ${{ needs.verification.result }}
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          IS_PRERELEASE: ${{ needs.detect.outputs.is_prerelease }}
        run: |
          set -euo pipefail
          RELEASE_TYPE="stable"
          [[ "${IS_PRERELEASE}" == "true" ]] && RELEASE_TYPE="pre-release"
          {
            echo "## Release Summary"
            echo ""
            echo "**Tag:** \`${TAG}\`  **Commit:** \`${COMMIT}\`  **Type:** ${RELEASE_TYPE}"
            echo ""
            echo "| Phase | Result |"
            echo "|-------|--------|"
            echo "| Detect | ${DETECT} |"
            echo "| Tests | ${TESTS} |"
            echo "| Release (GoReleaser + KinD + Trivy) | ${RELEASE} |"
            echo "| Helm Publish | ${HELM_PUBLISH} |"
            echo "| SLSA Provenance | ${PROVENANCE} |"
            echo "| SLSA Verification | ${VERIFICATION} |"
          } >> "$GITHUB_STEP_SUMMARY"

image:
  repository: ghcr.io/mchmarny/node-role-controller
  tag: ""  # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

config:
  roleLabel: "nodeGroup"
  roleReplace: "false"
  logLevel: "info"

replicas: 1

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi

tolerations: []
nodeSelector: {}

# Optional Prometheus operator integration. When enabled, a Service is
# created and a ServiceMonitor scrapes /metrics on the metrics port.
serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  labels: {}  # added to ServiceMonitor metadata; merged with chart labels

# Optional PodDisruptionBudget. Useful when replicas >= 2 so node drains
# don't take both leader and standby down at once.
podDisruptionBudget:
  enabled: false
  minAvailable: 1
